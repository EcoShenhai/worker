# =====================================================================
# Nginx site config — worker.eshcloud.com
# Serves the built React frontend and proxies /api to the Node backend
# on 127.0.0.1:4019. Place at /etc/nginx/sites-available/worker.eshcloud.com
# then: ln -s ../sites-available/worker.eshcloud.com /etc/nginx/sites-enabled/
# and run certbot to obtain TLS (see deploy/README.md).
# =====================================================================

server {
    listen 80;
    server_name worker.eshcloud.com;

    # Allow Certbot HTTP-01 challenge, redirect everything else to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name worker.eshcloud.com;

    # Certbot manages these paths after issuance.
    ssl_certificate     /etc/letsencrypt/live/worker.eshcloud.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/worker.eshcloud.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Audio uploads can be large.
    client_max_body_size 250M;

    # Built React app (copy frontend/dist here on deploy).
    root /var/www/worker;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API -> Node backend
    location /api/ {
        proxy_pass http://127.0.0.1:4019;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # transcription can take time
        proxy_send_timeout 300s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
